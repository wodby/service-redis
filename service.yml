name: redis
icon: redis
type: datastore
title: Redis
guidance: GUIDANCE.md
options:
- version: '8.6'
  tag: 8.6-r5
  digest: sha256:f91953e5ad9457211548cfa92fa6a2ea1952bd65a240e0fea326f7aa70ab0c27
  eol: '2026-11-25T00:00:00+00:00'
- version: '8.4'
  tag: 8.4-r5
  digest: sha256:ec8ca2c269891dc0f0f610ff6d581f44ce173cc36363d273eef31867703bcf8b
  eol: '2026-08-10T00:00:00+00:00'
- version: '8.2'
  tag: 8.2-r5
  digest: sha256:8e2d7bef516c1f2a6ad08380e75b6148f19d07e1476c02c5cbc124847475a8f5
  eol: '2030-09-01T00:00:00+00:00'
endpoints:
- name: redis
  ports:
  - name: redis
    number: 6379
    protocol: tcp
labels:
- redis

volumes:
- name: data
  title: Data
  optional: true
  helm:
# @todo: remove labels if imports introduced  
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'
    - name: persistence.storageClass
      value: '{{volumes.data.storageClassName}}'
    # mandatory to use existing claim since this volume will have import function
    # we will mount different claim after import and doing it through sts's volumeclaimtemplates is not supported
# disabled due to missing imports (required for this to work – we create PVC manually instead of using volumeClaimTemplate)
# @todo: remove labels if imports introduced
#    - name: persistence.existingClaim
#      value: '{{volumes.data.claim}}'

tokens:
- name: password
  generate:
    regex: '[0-9a-z-]{32}'

deployment:
  strategy: rolling
  minReady: 10s
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/redis
  chart: oci://registry-1.docker.io/wodby/redis
  version: 0.2.1
  values:
  - name: auth.password
    value: '{{password}}'

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: redis
    image: wodby/redis
    resources:
      preset: nano
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts
